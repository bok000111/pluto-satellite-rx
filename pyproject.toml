[project]
name = "pluto-satellite-rx"
version = "0.1.0"
description = "Offline Doppler analysis and METEOR LRPT recovery for saved IQ recordings"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "sgp4",
]

[project.optional-dependencies]
receive = ["pyadi-iio>=0.0.20,<1", "pylibiio>=0.25,<0.27"]

[tool.uv]
package = false
